<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Bloco de Poderes</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234f5bff'/%3E%3Cpath d='M11 9h10M11 14h10M11 19h6' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E" />
    <script>
      // Aplica o tema antes de desenhar a tela, para não piscar branco no modo escuro.
      (function () {
        var t = null
        try { t = localStorage.getItem('bloco-poderes:tema') } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      })()
    </script>
    <style>
      /* ---------- Tela de carregamento (aparece antes de tudo, sem depender do resto do site) ---------- */
      #splash {
        --sp-bg: #f5f6f8;
        --sp-fg: #141824;
        --sp-muted: #6b7385;
        --sp-card: #ffffff;
        --sp-line: #e6e8ee;
        --sp-track: #e4e7ef;
        --sp-blob1: rgba(99, 112, 255, 0.28);
        --sp-blob2: rgba(56, 189, 248, 0.22);
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: var(--sp-bg);
        color: var(--sp-fg);
        font-family: 'Inter Variable', 'Segoe UI', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        transition: opacity 0.55s ease, visibility 0.55s ease;
      }
      html[data-theme='dark'] #splash {
        --sp-bg: #0c0e13;
        --sp-fg: #e8eaf0;
        --sp-muted: #8a91a3;
        --sp-card: #14171e;
        --sp-line: #252a35;
        --sp-track: #20242e;
        --sp-blob1: rgba(100, 112, 255, 0.22);
        --sp-blob2: rgba(56, 189, 248, 0.12);
      }
      #splash.saindo { opacity: 0; visibility: hidden; }
      #splash.saindo .sp-centro { transform: scale(0.96) translateY(-6px); }

      /* Manchas de cor flutuando no fundo */
      .sp-blob { position: absolute; width: 46vmax; height: 46vmax; border-radius: 50%; filter: blur(70px); opacity: 0.9; }
      .sp-blob.a { background: var(--sp-blob1); top: -18vmax; left: -12vmax; animation: sp-flutua 14s ease-in-out infinite alternate; }
      .sp-blob.b { background: var(--sp-blob2); bottom: -20vmax; right: -14vmax; animation: sp-flutua 17s ease-in-out infinite alternate-reverse; }
      @keyframes sp-flutua { to { transform: translate(6vmax, 4vmax) scale(1.12); } }

      /* Pontilhado sutil */
      .sp-grade {
        position: absolute; inset: 0; opacity: 0.5;
        background-image: radial-gradient(var(--sp-line) 1px, transparent 1px);
        background-size: 22px 22px;
        -webkit-mask-image: radial-gradient(ellipse at center, #000 20%, transparent 70%);
        mask-image: radial-gradient(ellipse at center, #000 20%, transparent 70%);
      }

      .sp-centro { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 24px; transition: transform 0.55s cubic-bezier(.2,.8,.2,1); }

      /* Logo com anéis pulsando e caneta "escrevendo" */
      .sp-logo { position: relative; width: 84px; height: 84px; margin-bottom: 28px; animation: sp-entra 0.7s cubic-bezier(.2,.8,.2,1) both; }
      .sp-logo .anel { position: absolute; inset: 0; border-radius: 26px; border: 2px solid rgba(99, 112, 255, 0.45); animation: sp-anel 2.4s cubic-bezier(.2,.8,.2,1) infinite; }
      .sp-logo .anel.b { animation-delay: 1.2s; }
      @keyframes sp-anel { from { transform: scale(1); opacity: 0.8; } to { transform: scale(1.7); opacity: 0; } }
      .sp-logo .caixa {
        position: relative; width: 100%; height: 100%; border-radius: 26px; display: grid; place-items: center;
        background: linear-gradient(140deg, #7b84ff, #4350f0 60%, #3540d8);
        box-shadow: 0 18px 40px -12px rgba(79, 91, 255, 0.65), inset 0 1px 0 rgba(255,255,255,0.25);
        animation: sp-respira 2.4s ease-in-out infinite;
      }
      @keyframes sp-respira { 50% { transform: translateY(-3px) scale(1.03); } }
      .sp-logo .brilho { position: absolute; inset: 0; border-radius: 26px; overflow: hidden; }
      .sp-logo .brilho::after {
        content: ''; position: absolute; top: -50%; left: -60%; width: 40%; height: 200%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent);
        transform: rotate(20deg); animation: sp-brilho 2.8s ease-in-out infinite 0.6s;
      }
      @keyframes sp-brilho { to { left: 140%; } }
      .sp-logo svg { width: 40px; height: 40px; fill: none; stroke: #fff; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
      .sp-logo svg path { stroke-dasharray: 1; stroke-dashoffset: 1; animation: sp-desenha 1.1s cubic-bezier(.6,.1,.3,1) forwards; }
      .sp-logo svg path:nth-child(2) { animation-delay: 0.25s; }
      .sp-logo svg path:nth-child(3) { animation-delay: 0.35s; }
      .sp-logo svg path:nth-child(4) { animation-delay: 0.45s; }
      .sp-logo svg path:nth-child(5) { animation-delay: 0.55s; }
      .sp-logo svg path:nth-child(6) { animation-delay: 0.7s; }
      @keyframes sp-desenha { to { stroke-dashoffset: 0; } }

      .sp-titulo { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -0.02em; animation: sp-entra 0.7s 0.15s cubic-bezier(.2,.8,.2,1) both; }
      .sp-sub { margin: 6px 0 0; height: 20px; font-size: 13.5px; color: var(--sp-muted); animation: sp-entra 0.7s 0.25s cubic-bezier(.2,.8,.2,1) both; }
      .sp-sub span { display: inline-block; animation: sp-troca 0.45s cubic-bezier(.2,.8,.2,1); }
      @keyframes sp-troca { from { opacity: 0; transform: translateY(6px); } }
      @keyframes sp-entra { from { opacity: 0; transform: translateY(10px); } }

      /* Barra de progresso com brilho correndo */
      .sp-barra { margin-top: 26px; width: 200px; height: 5px; border-radius: 99px; background: var(--sp-track); overflow: hidden; animation: sp-entra 0.7s 0.35s cubic-bezier(.2,.8,.2,1) both; }
      .sp-barra i { display: block; height: 100%; width: 40%; border-radius: inherit; background: linear-gradient(90deg, #6470ff, #38bdf8); animation: sp-corre 1.3s cubic-bezier(.65,0,.35,1) infinite; }
      @keyframes sp-corre { from { transform: translateX(-110%); } to { transform: translateX(260%); } }

      /* Modo "site atualizado" */
      .sp-novidades { display: none; width: min(420px, calc(100vw - 48px)); margin-top: 22px; text-align: left; }
      #splash.novidade .sp-barra, #splash.novidade .sp-sub { display: none; }
      #splash.novidade .sp-novidades { display: block; }
      #splash.novidade .sp-logo .caixa { background: linear-gradient(140deg, #34d399, #10b981 55%, #059669); box-shadow: 0 18px 40px -12px rgba(16, 185, 129, 0.6), inset 0 1px 0 rgba(255,255,255,0.25); transition: background 0.5s; }
      #splash.novidade .sp-logo .anel { border-color: rgba(16, 185, 129, 0.45); }
      .sp-selo { display: inline-flex; align-items: center; gap: 6px; margin: 6px auto 0; padding: 4px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; color: #10b981; background: rgba(16, 185, 129, 0.12); }
      .sp-cartao { margin-top: 18px; border: 1px solid var(--sp-line); border-radius: 16px; background: var(--sp-card); padding: 6px; box-shadow: 0 10px 30px -15px rgba(0,0,0,0.25); }
      .sp-cartao h2 { margin: 8px 10px 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--sp-muted); }
      .sp-cartao ul { list-style: none; margin: 0; padding: 0; }
      .sp-cartao li { display: flex; gap: 10px; align-items: flex-start; padding: 9px 10px; border-radius: 10px; font-size: 14px; line-height: 1.45; animation: sp-item 0.5s cubic-bezier(.2,.8,.2,1) both; }
      @keyframes sp-item { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      .sp-cartao li::before { content: '✦'; color: #6470ff; font-size: 12px; margin-top: 2px; }
      .sp-btn {
        display: block; width: 100%; margin-top: 16px; height: 44px; border: 0; border-radius: 12px; cursor: pointer;
        font: inherit; font-size: 14.5px; font-weight: 600; color: #fff;
        background: linear-gradient(140deg, #6b75ff, #4350f0); box-shadow: 0 8px 20px -8px rgba(79, 91, 255, 0.7);
        transition: transform 0.15s, filter 0.15s;
      }
      .sp-btn:hover { filter: brightness(1.08); }
      .sp-btn:active { transform: scale(0.98); }
      .sp-btn:focus-visible { outline: 3px solid rgba(100, 112, 255, 0.45); outline-offset: 3px; }
      .sp-dica { margin-top: 8px; text-align: center; font-size: 12px; color: var(--sp-muted); }

      @media (prefers-reduced-motion: reduce) {
        #splash *, #splash *::before, #splash *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
        .sp-logo svg path { stroke-dashoffset: 0; }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-live="polite" aria-label="Carregando o Bloco de Poderes">
      <div class="sp-blob a"></div>
      <div class="sp-blob b"></div>
      <div class="sp-grade"></div>
      <div class="sp-centro">
        <div class="sp-logo" aria-hidden="true">
          <span class="anel"></span>
          <span class="anel b"></span>
          <div class="caixa">
            <div class="brilho"></div>
            <svg viewBox="0 0 24 24">
              <path pathLength="1" d="M13.4 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7.4" />
              <path pathLength="1" d="M2 6h4" />
              <path pathLength="1" d="M2 10h4" />
              <path pathLength="1" d="M2 14h4" />
              <path pathLength="1" d="M2 18h4" />
              <path pathLength="1" d="M21.378 5.626a1 1 0 1 0-3.004-3.004l-5.01 5.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z" />
            </svg>
          </div>
        </div>
        <h1 class="sp-titulo" id="sp-titulo">Bloco de Poderes</h1>
        <p class="sp-sub"><span id="sp-msg">Preparando suas anotações…</span></p>
        <div class="sp-barra"><i></i></div>

        <div class="sp-novidades" id="sp-novidades">
          <div style="text-align: center"><span class="sp-selo" id="sp-selo">✓ Versão nova</span></div>
          <div class="sp-cartao">
            <h2>O que mudou</h2>
            <ul id="sp-lista"></ul>
          </div>
          <button type="button" class="sp-btn" id="sp-comecar">Começar</button>
          <p class="sp-dica">Suas anotações continuam salvas.</p>
        </div>
      </div>
    </div>
    <script>
      // Troca a frase enquanto carrega.
      (function () {
        var frases = ['Preparando suas anotações…', 'Organizando as etapas…', 'Quase pronto…']
        var i = 0
        var el = document.getElementById('sp-msg')
        var t = setInterval(function () {
          var s = document.getElementById('splash')
          if (!s || s.classList.contains('novidade') || s.classList.contains('saindo')) return clearInterval(t)
          i = (i + 1) % frases.length
          var novo = el.cloneNode()
          novo.textContent = frases[i]
          el.replaceWith(novo)
          el = novo
        }, 900)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
