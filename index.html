<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Bloco de Poderes</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23002fa7'/%3E%3Cpath d='M11 9h10M11 14h10M11 19h6' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E" />
    <script>
      // Aplica o tema antes de desenhar a tela, para não piscar branco no modo escuro.
      (function () {
        var t = null
        try { t = localStorage.getItem('bloco-poderes:tema') } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      })()
    </script>
    <style>
      /* ---------- Tela de carregamento (aparece antes de tudo, sem depender do resto do site) ---------- */
      #splash {
        --sp-bg: #f7f7f8;
        --sp-fg: #111113;
        --sp-muted: #4e4e56;
        --sp-line: #e5e5e8;
        --sp-accent: #002fa7;
        --sp-on-accent: #ffffff;
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: var(--sp-bg);
        color: var(--sp-fg);
        font-family: 'Helvetica Neue', 'Segoe UI', Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        transition: opacity 0.18s ease, visibility 0.18s ease;
      }
      html[data-theme='dark'] #splash {
        --sp-bg: #0e0e10;
        --sp-fg: #ececee;
        --sp-muted: #a3a3ab;
        --sp-line: #29292e;
        --sp-accent: #8aa4ff;
        --sp-on-accent: #0b0b0d;
      }
      #splash.saindo { opacity: 0; visibility: hidden; }
      .sp-centro { width: min(420px, calc(100vw - 48px)); }
      .sp-titulo { margin: 0; font-size: 20px; font-weight: 600; }
      .sp-sub { margin: 4px 0 0; font-size: 13.5px; color: var(--sp-muted); }

      /* Modo "site atualizado" */
      .sp-novidades { display: none; margin-top: 4px; }
      #splash.novidade .sp-sub { display: none; }
      #splash.novidade .sp-novidades { display: block; }
      .sp-selo { margin: 0; font-size: 13px; color: var(--sp-muted); }
      .sp-cartao { margin-top: 18px; border-top: 1px solid var(--sp-line); }
      .sp-cartao h2 { margin: 14px 0 6px; font-size: 13px; font-weight: 600; }
      .sp-cartao ul { margin: 0; padding: 0 0 0 18px; list-style: disc; }
      .sp-cartao li { padding: 3px 0; font-size: 14px; line-height: 1.45; }
      .sp-btn {
        margin-top: 20px; height: 36px; padding: 0 18px; border: 0; border-radius: 4px; cursor: pointer;
        font: inherit; font-size: 13.5px; font-weight: 600; color: var(--sp-on-accent); background: var(--sp-accent);
      }
      .sp-btn:focus-visible { outline: 2px solid var(--sp-accent); outline-offset: 2px; }
      .sp-dica { margin: 10px 0 0; font-size: 12px; color: var(--sp-muted); }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-live="polite" aria-label="Carregando o Bloco de Poderes">
      <div class="sp-centro">
        <h1 class="sp-titulo" id="sp-titulo">Bloco de Poderes</h1>
        <p class="sp-sub" id="sp-msg">Carregando…</p>

        <div class="sp-novidades" id="sp-novidades">
          <p class="sp-selo" id="sp-selo">Versão nova</p>
          <div class="sp-cartao">
            <h2>O que mudou</h2>
            <ul id="sp-lista"></ul>
          </div>
          <button type="button" class="sp-btn" id="sp-comecar">Começar</button>
          <p class="sp-dica">Suas anotações continuam salvas.</p>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
